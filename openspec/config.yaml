schema: spec-driven

context: |
  W2 Server is a With Your Destiny (WYD) game server plus web interface.

  Tech stack: Rust (cargo workspace, `packages/apps/server`), Next.js + React +
  TypeScript (yarn workspace, `packages/apps/web`). Yarn workspaces at the root.

  `packages/apps/client` is a git submodule of open-w2-project/w2-client: a
  decompiled C++ Visual Studio client (MSBuild). It is developed alongside the
  server, but in its own repository — both sides of the wire protocol move.
  Packet structs and opcodes live in `Projects/TMProject/CPSock.cpp`,
  `Basedef.h`, `Enums.h`; read the pinned commit before shaping a packet, and
  again after a bump. Client changes may be authored from this repo in the
  submodule working tree and committed there on a named branch — never on a
  detached HEAD, never straight onto the pinned branch. The `/w2-commit` skill
  owns any commit touching both sides and fixes the order: client commit, then
  server/web commit, then the pin bump alone, then the client push followed by
  `git push --recurse-submodules=check`. The pin bump is a separate commit here
  whose only content is the new pinned submodule commit. A protocol change that
  needs both sides lands in w2-client first, then the pin moves here — the
  server must never target a shape the pinned client does not have.

